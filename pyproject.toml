[project]
name = "autollm-gate"
version = "0.1.0"
description = "AutoLLM Gate：OpenAI / Anthropic 兼容的智能 LLM 路由网关"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "pyyaml>=6", "sqlalchemy>=2.0", "cryptography>=42", "psycopg2-binary>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["core", "admin"]

[tool.setuptools.package-data]
autollm_gate = ["scoring.yaml"]
autollm_admin = ["dashboard.html"]

[tool.pytest.ini_options]
pythonpath = ["core", "admin"]
testpaths = ["tests"]
