[project]
name = "autollm-gate"
version = "0.3.0"
description = "AutoLLM Gate：OpenAI / Anthropic / Responses 兼容的智能 LLM 路由网关"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "pyyaml>=6",
  "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "aiosqlite>=0.20", "alembic>=1.13",
  "redis>=5", "cryptography>=42", "argon2-cffi>=23", "pyjwt>=2.8", "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fakeredis>=2.23"]

[tool.setuptools.packages.find]
where = ["core", "admin"]

[tool.setuptools.package-data]
autollm_gate = ["scoring.yaml"]
autollm_admin = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
pythonpath = ["core", "admin", "tests"]
testpaths = ["tests"]
