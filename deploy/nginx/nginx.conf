# 2 个网关副本前的负载均衡。会话粘性 / 限流 / 配置广播都在 Redis，副本之间无状态，可任意轮询。
worker_processes auto;
events { worker_connections 4096; }
http {
  upstream gate {
    least_conn;
    server gate-1:8080 max_fails=3 fail_timeout=10s;
    server gate-2:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }
  log_format json escape=json '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"rt":$request_time,"upstream":"$upstream_addr","urt":"$upstream_response_time"}';
  access_log /dev/stdout json;
  client_max_body_size 20m;
  server {
    listen 8080;
    location / {
      proxy_pass http://gate;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      # 流式响应（SSE）不缓冲
      proxy_buffering off;
      proxy_read_timeout 600s;
      # 副本宕机 / 未就绪时自动换另一个副本（仅限尚未发送响应的请求）
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
    }
    location = /metrics { deny all; }  # 指标只给 Prometheus 直连各副本抓取
  }
}
