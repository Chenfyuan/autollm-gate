services:
  gate:
    image: autollm-gate:latest
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://autollm:${POSTGRES_PASSWORD}@db:5432/autollm
    ports: ["8080:8080"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autollm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: autollm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autollm"]
      interval: 5s
      retries: 10
    restart: unless-stopped
volumes:
  pgdata:
