# 单实例：COMPOSE_PROFILES=single（.env 默认）docker compose up -d --build
# 多实例（2 个网关副本 + nginx 负载均衡）：COMPOSE_PROFILES=ha docker compose up -d --build
# 加 Prometheus：COMPOSE_PROFILES=ha,monitoring
x-gate: &gate
  image: autollm-gate:0.2
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://autollm:${POSTGRES_PASSWORD}@db:5432/autollm
    REDIS_URL: redis://redis:6379/0
    TRUST_PROXY: "1"
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped

services:
  gate:
    <<: *gate
    build: .
    ports: ["${GATE_PORT:-8080}:8080"]
    profiles: ["single"]

  gate-1:
    <<: *gate
    build: .
    profiles: ["ha"]
  gate-2:
    <<: *gate
    profiles: ["ha"]
  lb:
    image: nginx:1.27-alpine
    profiles: ["ha"]
    volumes: ["./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["${GATE_PORT:-8080}:8080"]
    depends_on: [gate-1, gate-2]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autollm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: autollm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autollm"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    volumes: ["./deploy/prometheus:/etc/prometheus:ro"]
    ports: ["9090:9090"]

volumes:
  pgdata:
  redisdata:
