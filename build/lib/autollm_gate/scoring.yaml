# 模型评分配置（可编辑）。
# 分数来源：综合参考公开榜单 —— LMArena (lmarena.ai) 文本/代码榜、Artificial Analysis
# (artificialanalysis.ai) 质量/速度指数、各厂商官方公开定价页。数值为本项目人工归一化(0-10)，
# 仅作路由启发，请按自身业务定期校准。价格单位：美元 / 百万 token。
models:
  gpt-4o:            {provider: openai,    quality: 8.5, coding: 8.0, reasoning: 7.5, speed: 8.0, price_in: 2.5,  price_out: 10.0, context: 128000}
  gpt-4o-mini:       {provider: openai,    quality: 6.5, coding: 6.0, reasoning: 5.5, speed: 9.5, price_in: 0.15, price_out: 0.6,  context: 128000}
  claude-sonnet-4-5: {provider: anthropic, quality: 9.0, coding: 9.5, reasoning: 8.5, speed: 7.0, price_in: 3.0,  price_out: 15.0, context: 200000}
  claude-haiku-4-5:  {provider: anthropic, quality: 7.0, coding: 7.0, reasoning: 6.0, speed: 9.0, price_in: 1.0,  price_out: 5.0,  context: 200000}
  gemini-2.5-pro:    {provider: gemini,    quality: 9.0, coding: 8.5, reasoning: 9.0, speed: 6.5, price_in: 1.25, price_out: 10.0, context: 1000000}
  gemini-2.5-flash:  {provider: gemini,    quality: 7.5, coding: 7.0, reasoning: 7.0, speed: 9.5, price_in: 0.3,  price_out: 2.5,  context: 1000000}
  deepseek-chat:     {provider: deepseek,  quality: 7.5, coding: 7.5, reasoning: 6.5, speed: 7.5, price_in: 0.27, price_out: 1.1,  context: 64000}
  deepseek-reasoner: {provider: deepseek,  quality: 8.0, coding: 8.0, reasoning: 9.0, speed: 4.0, price_in: 0.55, price_out: 2.19, context: 64000}
  # 平台自部署开源权重模型（vLLM / Ollama 等 OpenAI 兼容端点）。price_* 为平台对外售价，可自行调整。
  # 模型名需与自部署端点 served-model-name 一致；请确认对应权重的许可证允许商用。
  qwen3-32b:         {provider: selfhosted, quality: 7.5, coding: 7.5, reasoning: 7.5, speed: 7.0, price_in: 0.2, price_out: 0.6, context: 32000}
  llama-3.3-70b:     {provider: selfhosted, quality: 7.0, coding: 6.5, reasoning: 6.5, speed: 6.5, price_in: 0.3, price_out: 0.8, context: 128000}

# 策略权重：维度 -> 权重。cost 维度 = 价格越低越高分；任务维度按请求分类加权。
strategies:
  cost_optimized:   {quality: 0.25, cost: 0.55, speed: 0.20}
  balanced:         {quality: 0.45, cost: 0.30, speed: 0.25}
  quality_first:    {quality: 0.80, cost: 0.05, speed: 0.15}
  latency_critical: {quality: 0.20, cost: 0.20, speed: 0.60}
default_strategy: cost_optimized
# 任务类型 -> 质量维度使用哪个分项
task_dimension: {coding: coding, reasoning: reasoning, chat: quality, long_context: quality}
max_fallbacks: 3
